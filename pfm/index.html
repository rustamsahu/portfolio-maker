<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Portfolio Maker</title>
<style>
* {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
}
body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            font-family:
                "Segoe UI",
                Arial,
                sans-serif;
            color: #18181b;
            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(173, 216, 255, .5),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(255, 180, 245, .45),
                    transparent 30%
                ),
                #f5f7fb;
            overflow: hidden;
            transition:
                background .5s ease;
}
.circle {
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            opacity: .45;
            pointer-events: none;
            z-index: -1;
            animation:
                float 7s ease-in-out infinite;
 }
.circle.one {
            width: 180px;
            height: 180px;
            background: #b5e5ff;
            top: 8%;
            left: 5%;
}
.circle.two {
            width: 220px;
            height: 220px;
            background: #ffc5f3;
            bottom: 5%;
            right: 5%;
            animation-delay: 1.5s;
}
 .circle.three {
            width: 100px;
            height: 100px;
            background: #d9c8ff;
            top: 55%;
            left: 45%;
            animation-delay: 3s;
 }
 @keyframes float {
            0%,
            100% {     transform: translateY(0); }
            50% { transform: translateY(-25px);}
}
#cont {
            width: 430px;
            max-width: 100%;
            padding: 42px;
            border-radius: 26px;
            background: rgba(255,255,255,.88);
            border: 1px solid rgba(255,255,255,.9);
            box-shadow: 0 30px 80px rgba(0,0,0,.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: cardAppear .7s ease;
            transition:  transform .3s ease, box-shadow .3s ease;
}
#cont:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 90px rgba(0,0,0,.18);
 }
@keyframes cardAppear {
            from { opacity: 0; transform: translateY(35px)scale(.97);}
            to {opacity: 1;transform: translateY(0)scale(1);}
}
.brand {
            text-align: center;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #777;
 }
#title {
            text-align: center;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 10px;
            animation: textAppear .45s ease;
 }
@keyframes textAppear { from { opacity: 0; transform: translateY(8px);}
            to {opacity: 1;transform: translateY(0);}
 }
 #title::after {
            content: "";
            display: block;
            width: 45px;
            height: 4px;
            margin: 12px auto 0;
            border-radius: 10px;
            background: #111;
}
#caption {
            margin: 18px auto 28px;
            max-width: 330px;
            text-align: center;
            color: #71717a;
            font-size: 14px;
            line-height: 1.6;
            animation: fadeIn .6s ease;
}
@keyframes fadeIn {
        from { opacity: 0; }
         to {opacity: 1; }
}
 #authMode {
            display: flex;
            padding: 5px;
            margin-bottom: 28px;
            border-radius: 13px;
            background: #eeeeF2;
}
.authModeBtn {
            width: 50%;
            height: 44px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: #777;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
            transition: background .25s ease, color .25s ease, box-shadow .25s ease,transform .2s ease;
}
.authModeBtn:hover {
            color: #222;
}
.authModeBtn.active {
            background: white;
            color: #111;
            box-shadow:0 3px 12px rgba(0,0,0,.1);
}
.authModeBtn:active {
        transform:scale(.97);
}
#authForm {
            animation:formAppear .6s ease;
}
@keyframes formAppear {
    from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
}
.form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 650;
            color: #343434;
}
.form-control {
            width: 100%;
            height: 52px;
            padding:12px 16px;
            margin-bottom: 21px;
            border: 1.5px solid #dedfe5;
            border-radius: 12px;
            outline: none;
            background: white;
            color: #18181b;
            font-size: 15px;
            transition:border .25s ease,box-shadow .25s ease, transform .2s ease;
}
        .form-control:hover {
            border-color: #aaa;
}
.form-control:focus {
            border-color: #111;
         box-shadow: 0 0 0 4px rgba(0,0,0,.07);
        transform:translateY(-1px);
}
.form-control::placeholder {
            color: #aaa;
}
#submitBtn {
            width: 100%;
            height: 52px;
            margin-top: 5px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #111, #292929);
            color: white;
            font-size: 15px;
            font-weight: 650;
            letter-spacing: .2px;
            cursor: pointer;
            box-shadow: 0 9px 22px rgba(0,0,0,.2);
            transition:transform .2s ease,box-shadow .2s ease, background .2s ease;
}
#submitBtn:hover {
            transform:
                translateY(-3px);
            box-shadow:
                0 13px 28px rgba(0,0,0,.27);
            background:linear-gradient(135deg,#222, #000);
}
#submitBtn:active {
    transform: translateY(0);
}
.bottomText {
            margin-top: 22px;
            text-align: center;
            font-size: 12px;
            color: #999;
}
@media (max-width: 550px) {
   body {
                padding: 20px 12px;
                overflow-y: auto;
    }
   #cont {
        padding:30px 22px;
        border-radius:21px;
    }
    #title {
            font-size: 29px;
    }
    .circle.one {
         width: 120px;
         height: 120px;
    }
    .circle.two {
                width: 150px;
                height: 150px;
    }
}
@media (max-width: 350px) {

    #cont {
       padding:25px 17px;
     }
     #title {

                font-size:
                    27px;
     }
   #caption {
                font-size: 13px;
   }
}
</style>
</head>
<body>
    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>
    <div id="cont">
        <div class="brand"> Portfolio Maker</div>
        <h1 id="title">Start Building </h1>
        <p id="caption">
            Create your portfolio, showcase your projects,
            and share your work with the world.
        </p>
        <div id="authMode">
            <button type="button"id="signUpBtn"class="authModeBtn active" >
                Sign Up
            </button>
            <button type="button"id="loginBtn"class="authModeBtn"
            > Login
            </button>
        </div>
        <form id="authForm"method="post"action="/submitSignIn">
            <label for="username"class="form-label"
            > Username
            </label>
            <input type="text" id="username" class="form-control" name="name" placeholder="Enter your username" required >
            <label for="password"class="form-label"> Password
            </label>
            <input type="password"id="password" class="form-control"name="password"placeholder="Create a password"required>
            <button type="submit" id="submitBtn">Start Building → </button>
        </form>
        <p class="bottomText">
            Your work deserves to be seen.
        </p>
    </div>
<script>
let signUpBtn =document.querySelector("#signUpBtn");
let loginBtn =document.querySelector("#loginBtn");
let authForm =document.querySelector("#authForm");
let title =document.querySelector("#title");
let caption = document.querySelector("#caption");
let submitBtn = document.querySelector("#submitBtn");
let password = document.querySelector("#password");
signUpBtn.addEventListener("click", () => {
            title.innerText =
                "Start Building";
            caption.innerText =
                "Create your portfolio, showcase your projects, and share your work with the world.";
            submitBtn.innerText =
                "Start Building →";
            password.placeholder =
                "Create a password";
            authForm.action =
                "/submitSignIn";
            signUpBtn.classList.add("active");
            loginBtn.classList.remove("active");
        });
loginBtn.addEventListener("click", () => {
            title.innerText =
                "Welcome Back";
            caption.innerText =
                "Your projects are waiting for you. Continue building something worth showing.";
            submitBtn.innerText =
                "Continue →";
            password.placeholder =
                "Enter your password";
            authForm.action =
                "/submitLogin";
            loginBtn.classList.add("active");
            signUpBtn.classList.remove("active");
        });
</script>
</body>
</html>
